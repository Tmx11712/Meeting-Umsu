services:
  # ==========================================
  # 1. Main PHP-FPM Application
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: enotulen-app:latest
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    env_file:
      - .env
    volumes:
      - enotulen-storage:/var/www/html/storage
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================
  # 2. Nginx Web Server
  # ==========================================
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - enotulen-public:/var/www/html/public
    depends_on:
      - app

  # ==========================================
  # 3. Queue Worker
  # ==========================================
  worker:
    image: enotulen-app:latest
    restart: unless-stopped
    command: php artisan queue:work --queue=default --sleep=3 --tries=3
    env_file:
      - .env
    volumes:
      - enotulen-storage:/var/www/html/storage
    depends_on:
      - app
      - redis

  # ==========================================
  # 4. Reverb WebSocket Server
  # ==========================================
  reverb:
    image: enotulen-app:latest
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "6001:8080"
    env_file:
      - .env
    depends_on:
      - app
      - redis

  # ==========================================
  # 5. Infrastructure Dependencies
  # ==========================================
  pgsql:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: enotulen
      POSTGRES_USER: enotulen
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - "enotulen-pgsql:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enotulen"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - "enotulen-redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - "enotulen-minio:/data"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/enotulen-recordings --ignore-existing;
      mc mb myminio/enotulen-documents --ignore-existing;
      mc anonymous set public myminio/enotulen-recordings;
      mc anonymous set public myminio/enotulen-documents;
      "
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

volumes:
  enotulen-storage:
  enotulen-public:
  enotulen-pgsql:
  enotulen-redis:
  enotulen-minio:
